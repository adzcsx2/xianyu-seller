<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>闲鱼卖家 - 自动 AI 聊天工作台</title>
    <meta name="description" content="闲鱼卖家账号、商品、订单、消息与自动化运营工作台" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('xianyu-theme-preference');
          const preference = ['light', 'dark', 'system'].includes(stored) ? stored : 'system';
          const resolved = preference === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.classList.toggle('dark', resolved === 'dark');
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root" data-app-shell="xianyu-seller"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
