# 闲鱼卖家 —— NAS / 低配设备专用部署配置（零构建）
#
# 适用于飞牛 fnOS、群晖、威联通、软路由等设备。
#
# 与 docker-compose.yml 的区别，也是这个文件存在的原因：
#   1. 不在本机构建镜像，直接拉预构建镜像。NAS 上跑 npm ci + vite build +
#      pip 编译 + 下载 Chromium 会让 CPU 长时间 100%，内存不够时 OOM，
#      表现就是"部署不上、机器卡死"。
#   2. 不依赖 .env 文件。NAS 的 Docker 图形界面里通常只能贴 compose 内容，
#      没有地方放 .env，原配置的 ${ADMIN_PASSWORD:?...} 会直接让部署中断。
#   3. 内存上限给到 3G。Chromium 冷启动峰值就要 300~500M，2G 容易被 OOM
#      杀掉，配合 restart 策略会变成反复重启、CPU 一直满。
#
# 使用前请注意：默认开启登录验证，部署前应设置强管理员密码。
#
# 启动：docker compose -f docker-compose.nas.yml up -d

services:
  xianyu-app:
    image: ghcr.io/adzcsx2/xianyu-seller:latest
    container_name: xianyu-seller
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./backups:/app/backups:rw
      # Persist the slidex browser/device profile across container recreation.
      - ./browser_data/slidex:/root/.slidex:rw
    environment:
      TZ: Asia/Shanghai
      DB_PATH: /app/data/xianyu_data.db
      LOG_LEVEL: INFO

      # false 为免登录，true 为手动登录。开放公网前必须改为 true 并设置强密码。
      ADMIN_LOGIN_ENABLED: "${ADMIN_LOGIN_ENABLED:-true}"
      SESSION_TIMEOUT_SECONDS: "${SESSION_TIMEOUT_SECONDS:-86400}"
      AUTO_SLIDER_ENABLED: "${AUTO_SLIDER_ENABLED:-false}"
      # 每次启动都会同步内置管理员账号；请通过 .env 或环境变量修改默认值。
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"

      # 兼容期默认输入；功能区 system_settings 优先，不覆盖已保存值。
      AUTO_REPLY_ENABLED: "true"
      AUTO_DELIVERY_ENABLED: "true"
      AI_REPLY_ENABLED: "false"
      API_KEY: "${API_KEY:-}"
      MODEL_BASE_URL: "${MODEL_BASE_URL:-}"
      MODEL_NAME: "${MODEL_NAME:-}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 3072M
        reservations:
          memory: 512M
